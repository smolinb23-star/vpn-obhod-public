name: vpn_service
description: Multi-method VPN with whitelist bypass and auto-switching.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_vless: ^1.1.7
  flutter_singbox_client: ^1.0.0
  flutter_riverpod: ^2.5.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.0
  http: ^1.2.0
  file_picker: ^8.3.7
  permission_handler: ^11.3.1
  share_plus: ^7.2.2
  path_provider: ^2.1.4
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
