name: Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # flutter pub get создаёт android/local.properties (нужен settings.gradle.kts)
      - name: flutter pub get
        run: flutter pub get

      # Wrapper (gradlew + jar) лежит в репозитории — только права на Linux
      - name: chmod gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --no-pub

      # Kotlin-тесты сборки AWG .conf (AwgConfBuilder). Не блокируют сборку APK:
      # при падении видно в логе, но артефакт всё равно нужен.
      - name: kotlin unit tests
        working-directory: android
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: flutter build apk --release
        run: |
          for i in 1 2 3; do
            echo "Build attempt $i/3"
            if flutter build apk --release; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Build attempt $i failed, waiting 30s before retry..."
            sleep 30
          done
          echo "All 3 build attempts failed"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # Blob-хранилище артефактов недоступно из некоторых сетей — дублируем
      # APK в GitHub Releases (objects.githubusercontent.com доступен везде).
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-$GITHUB_SHA" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "APK ${{ github.sha }}" \
            --notes "Automated build (debug-signed). Commit: ${{ github.sha }}" \
            || gh release upload "apk-$GITHUB_SHA" \
              build/app/outputs/flutter-apk/app-release.apk --clobber
